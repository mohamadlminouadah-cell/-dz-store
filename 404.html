<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>الصفحة غير موجودة</title>
<script>
  // استضافة GitHub Pages: حوّل رابط المنتج /p/ID إلى /?p=ID
  (function () {
    var m = location.pathname.match(/^(.*)\/p\/([0-9a-f-]{36})\/?$/i);
    if (m) location.replace((m[1] || '') + '/?p=' + m[2]);
  })();
</script>
<style>body{font-family:system-ui,Tahoma,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f2f5f1;color:#13302b;text-align:center}a{color:#0f6b5c;font-weight:700}</style>
</head><body><div><h1>الصفحة غير موجودة</h1><p><a href="./">العودة إلى المتجر</a></p></div></body></html>
